<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 40" fill="none">
  <!-- Icon mark (scaled up from favicon) -->
  <rect width="40" height="40" rx="9" fill="#101010"/>
  <!-- Vertical stem -->
  <rect x="10" y="8.75" width="4.375" height="22.5" fill="#f9f9f9"/>
  <!-- Top crossbar -->
  <rect x="14.375" y="8.75" width="15.625" height="4.375" fill="#f9f9f9"/>
  <!-- Mid crossbar -->
  <rect x="14.375" y="18.125" width="10" height="4.375" fill="#f9f9f9"/>

  <!-- Wordmark: "Fyn" bold + "fo" regular, matching BrandText component -->
