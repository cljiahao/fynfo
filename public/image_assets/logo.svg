    x="52"
    y="27"
    font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="22"
    fill="#101010"
  ><tspan font-weight="800">Fyn</tspan><tspan font-weight="400">fo</tspan></text>
</svg>
