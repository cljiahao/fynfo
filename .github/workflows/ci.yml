name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hygiene:
    name: Lint & Format
    uses: ./.github/workflows/hygiene.yml

  build-scan:
    name: Docker Build & Scan
    uses: ./.github/workflows/docker-build-scan.yml
    with:
      image-name: ${{ vars.DOCKERHUB_USERNAME }}/fynfo
      image-tag: sha-${{ github.sha }}
      platform: linux/arm64
      fail-on-vulnerabilities: false

  push:
    name: Push to Docker Hub
    needs: [hygiene, build-scan]
    # Only push on merges to main — PRs just verify build + scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/docker-push-hub.yml
    with:
      image-name: ${{ vars.DOCKERHUB_USERNAME }}/fynfo
      image-tag: sha-${{ github.sha }}
      platform: linux/arm64
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
