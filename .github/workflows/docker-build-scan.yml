name: Docker Build & Trivy Scan

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Docker image name (e.g. username/fynfo)'
        required: true
        type: string
      image-tag:
        description: 'Tag to apply to the built image'
        required: true
        type: string
      platform:
        description: 'Target build platform (e.g. linux/arm64)'
        required: false
        type: string
        default: 'linux/arm64'
      fail-on-vulnerabilities:
        description: 'Exit with error if CRITICAL/HIGH vulnerabilities are found'
        required: false
        type: boolean
        default: false
      trivy-ignorefile:
        description: 'Path to a .trivyignore file (leave blank to skip)'
        required: false
        type: string
        default: '.trivyignore.yaml'

jobs:
  build-scan:
    name: Build & Scan Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve prod base image
        id: resolve-base
        run: |
          NODE_IMAGE=$(grep -m1 'ARG NODE=' Dockerfile | sed 's/ARG NODE=//' | tr -d '[:space:]')
          HARDENED_IMAGE="dhi.io/${NODE_IMAGE}"
          echo "Attempting to pull hardened image: ${HARDENED_IMAGE}"
          if docker pull "${HARDENED_IMAGE}" 2>/dev/null; then
            echo "build-args=NODE=${HARDENED_IMAGE}" >> "$GITHUB_OUTPUT"
            echo "Using hardened image: ${HARDENED_IMAGE}"
          else
            echo "build-args=" >> "$GITHUB_OUTPUT"
            echo "Hardened image not available, falling back to default"
          fi

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          platforms: ${{ inputs.platform }}
          push: false
          load: true
          tags: ${{ inputs.image-name }}:${{ inputs.image-tag }}
          build-args: ${{ steps.resolve-base.outputs.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Security Scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ inputs.image-name }}:${{ inputs.image-tag }}
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln,misconfig,secret'
          ignore-unfixed: true
          format: table
          output: trivy-results.txt
          trivyignores: ${{ inputs.trivy-ignorefile }}
          exit-code: ${{ inputs.fail-on-vulnerabilities && '1' || '0' }}

      - name: Upload Trivy Scan Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results
          path: trivy-results.txt
          retention-days: 30
